name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      # Enables the test that goes through a real broker.
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      # Warnings are errors (Directory.Build.props), so analyzers and code style gate the build.
      - run: dotnet build --no-restore -c Release
      # Unit, integration (outbox, inbox, API, real RabbitMQ) and architecture tests.
      - run: dotnet test --no-build -c Release

  outage:
    name: Broker outage end to end (Docker Compose)
    runs-on: ubuntu-latest
    needs: [dotnet]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Start RabbitMQ and the API
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fsL http://localhost:8080/scalar | grep -qi 'scalar'
      - name: Stop the broker, keep writing, start it again, and check nothing was lost
        run: |
          set -euo pipefail
          api=http://localhost:8080/api
          json='content-type: application/json'
          # Wait until the sample data is published, so the counts below only see the outage.
          for i in $(seq 1 30); do [ "$(curl -fs $api/outbox/stats | jq '.pending')" -eq 0 ] && [ "$(curl -fs $api/invoices | jq length)" -ge 3 ] && break; sleep 2; done

          docker compose stop rabbitmq
          for i in 1 2 3; do
            curl -fs -X POST $api/subscriptions -H "$json" -d "{\"customerEmail\":\"outage$i@example.com\",\"plan\":\"Pro\"}" > /dev/null
          done
          sleep 5
          curl -fs $api/outbox/stats | tee stats.json
          [ "$(jq .pending stats.json)" -eq 3 ]

          docker compose start rabbitmq
          for i in $(seq 1 60); do [ "$(curl -fs $api/outbox/stats | jq .pending)" -eq 0 ] && break; sleep 2; done
          for i in $(seq 1 30); do [ "$(curl -fs $api/invoices | jq '[.[] | select(.customerEmail | startswith("outage"))] | length')" -eq 3 ] && break; sleep 2; done
          curl -fs $api/outbox/stats
          [ "$(curl -fs $api/invoices | jq '[.[] | select(.customerEmail | startswith("outage"))] | length')" -eq 3 ]
      - if: always()
        run: docker compose logs api && docker compose down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; the action builds a "<first>^..HEAD" range that fails on a root commit.
      - name: Scan full git history with gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
